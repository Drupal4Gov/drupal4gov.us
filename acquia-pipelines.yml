version: 1.3.0
services:
  - mysql
  - composer:
      version: 2
  - php:
      version: 8.3

events:
  build:
    steps:
        - setup-env:
            type: script
            script:
              - composer validate --no-check-all --ansi
              - composer install --ansi
        - validate:
            type: script
            script:
              - composer lint
        - build-artifact:
            type: script
            script:
              # Strip dev dependencies from the deployed artifact.
              - composer install --no-dev --optimize-autoloader --ansi
