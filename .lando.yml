name: drupal4gov
recipe: acquia
config:
  webroot: docroot
  xdebug: false
  php: '8.3'
services:
  database:
    type: 'mysql:8.0'

  appserver:
    xdebug: false
    overrides:
      volumes:
        # Pass SSH keys.
        - type: bind
          source: "${LANDO_SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}"
          target: /run/host-services/ssh-auth.sock

        # Disable SSL for local MySQL client connections.
        - type: bind
          source: ./lando/mysql-client.cnf
          target: /etc/mysql/conf.d/99-lando-client.cnf

      environment:
        DRUSH_OPTIONS_URI: "https://drupal4gov.lndo.site/"
        SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock

      cap_add:
        - SYS_ADMIN
  node:
    type: node:22
    globals:
      gulp-cli: latest
      npm: latest
tooling:
  blt:
    service: appserver
    cmd: /app/vendor/bin/blt
  xdebug-on:
    service: appserver
    description: Enable xdebug for apache.
    cmd: "docker-php-ext-enable xdebug && /etc/init.d/apache2 reload"
    user: root
  xdebug-off:
    service: appserver
    description: Disable xdebug for apache.
    cmd: "rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && /etc/init.d/apache2 reload"
    user: root
  ssh-fix:
    service: appserver
    description: Fix ssh auth sock permission for MacOS users. Lando rebuild fixes the problem as well.
    cmd: "/bin/chgrp www-data /run/host-services/ssh-auth.sock && /bin/chmod g+w /run/host-services/ssh-auth.sock"
    user: root
  node:
    service: node
  npm:
    service: node
  gulp:
    service: node
events:
  post-start:
    - appserver: test -e ~/.ssh/config || printf 'Host *\n  AddKeysToAgent yes\n' > ~/.ssh/config
